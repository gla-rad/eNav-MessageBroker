<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <title>e-Navigation Message Broker Fragments</title>
    </head>
    <body>
        <!--
          ~ Everything that belongs in the document head of every page. This is
          ~ a th:block rather than a <head> element on purpose, so that the
          ~ pages including it keep a single, well formed head of their own.
          -->
        <th:block th:fragment="headerfiles">
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="color-scheme" content="light dark">
            <title>e-Navigation Message Broker</title>
            <link rel="icon" type="image/png" th:href="@{/images/favicon.ico}" />
            <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
            <link rel="stylesheet" th:href="@{/webjars/font-awesome/7.2.0/css/all.min.css}" />
            <link rel="stylesheet" th:href="@{/css/common.css}" />
            <!--
              ~ The colour scheme is applied before the first paint so that a
              ~ user who picked the dark theme never sees a flash of the light
              ~ one.
              -->
            <script>
                (function () {
                    var stored = null;
                    try { stored = window.localStorage.getItem('msg-broker-theme'); } catch (e) { /* storage disabled */ }
                    var preferred = stored
                        || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                    document.documentElement.setAttribute('data-bs-theme', preferred);
                })();
            </script>
        </th:block>

        <!--
          ~ The scripts every page depends on - jQuery, Bootstrap and our own
          ~ shared helpers.
          -->
        <th:block th:fragment="core-scripts">
            <script type="text/javascript" th:src="@{/webjars/jquery/jquery.min.js}"></script>
            <script type="text/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
            <script type="text/javascript" th:src="@{/src/common.js}"></script>
        </th:block>

        <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark app-navbar">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/}">
                    <span class="brand-mark"><i class="fa-solid fa-tower-broadcast"></i></span>
                    <span class="brand-text">
                        <span class="brand-title">e-Nav [[${appName}]]</span>
                        <span class="brand-subtitle">Publication Hub</span>
                    </span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                        aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                    <ul class="navbar-nav me-auto mt-2 mt-lg-0">
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <a class="nav-link" th:classappend="${page == 'index'} ? 'active'" th:href="@{/}">
                                <i class="fa-solid fa-gauge-high"></i><span>Monitor</span>
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <a class="nav-link" th:classappend="${page == 'about'} ? 'active'" th:href="@{about}">
                                <i class="fa-solid fa-circle-info"></i><span>About</span>
                            </a>
                        </li>
                    </ul>
                    <ul class="navbar-nav align-items-lg-center gap-2 mt-2 mt-lg-0">
                        <li class="nav-item">
                            <button type="button" class="navbar-action theme-toggle" data-theme-toggle
                                    title="Switch between the light and dark theme" aria-label="Switch colour theme">
                                <i class="fa-solid fa-moon theme-icon-light"></i>
                                <i class="fa-solid fa-sun theme-icon-dark"></i>
                            </button>
                        </li>
                        <li class="nav-item" sec:authorize="!isAuthenticated()">
                            <a class="nav-link" href="/login" th:href="@{login}">
                                <i class="fa-solid fa-right-to-bracket"></i><span>Sign in</span>
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <a class="nav-link" href="/logout" th:href="@{logout}">
                                <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!--
          ~ The title block that introduces each page, sitting above its card.
          -->
        <header th:fragment="page-header(icon, title, subtitle)" class="page-header" sec:authorize="isAuthenticated()">
            <div class="page-header-icon"><i th:class="'fa-solid ' + ${icon}"></i></div>
            <div>
                <h1 class="page-title" th:text="${title}">Title</h1>
                <p class="page-subtitle" th:text="${subtitle}">Subtitle</p>
            </div>
        </header>

        <div th:fragment="login-card" class="card app-card login-card" sec:authorize="!isAuthenticated()">
            <div class="card-body p-4">
                <div class="login-mark"><i class="fa-solid fa-tower-broadcast"></i></div>
                <h2 class="h4 mb-2">Welcome to the [[${appName}]]</h2>
                <p class="cell-muted mb-4">Please sign in to access the service facilities.</p>
                <button type="button" class="btn btn-primary" title="Sign In" onclick="window.location.href='login'">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span class="btn-label">Sign In</span>
                </button>
            </div>
        </div>

        <footer th:fragment="footer" class="app-footer">
            <div class="row g-2 align-items-center">
                <div class="col-sm-4 footer-left">
                    <a th:href="@{${appOperatorUrl}}" target="_blank" rel="noopener">
                        [[${appCopyright}]]
                    </a>
                </div>
                <div class="col-sm-4 footer-center">
                    <a th:href="@{${appOperatorUrl}}" target="_blank" rel="noopener">
                        <img th:src="@{/images/company-logo.png}" height="34" alt="Operator logo"/>
                    </a>
                </div>
                <div class="col-sm-4 footer-right">
                    <a th:href="@{about}">About this service</a>
                </div>
            </div>
        </footer>
    </body>
</html>
